name: Update CHPY ROC History and Deploy

on:
  workflow_dispatch:

  schedule:
    # CHPY/YieldMax의 미국 영업일 기준.
    # 월~금, 매시간 17분 / 47분에 실행.
    - cron: "17,47 * * * 1-5"
      timezone: "America/New_York"

  push:
    branches:
      - master

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "chpy-roc-pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    outputs:
      should_deploy: ${{ steps.deploy_decision.outputs.should_deploy }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      # push 이벤트에서는 사이트 배포만 하면 되므로
      # 데이터 수집용 Node 환경은 schedule / 수동 실행에서만 준비한다.
      - name: Setup Node.js
        if: github.event_name != 'push'
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        if: github.event_name != 'push'
        run: npm install

      - name: Fetch CHPY distribution history and generate OG image
        if: github.event_name != 'push'
        run: npm run update

      - name: Commit updated data
        id: commit_data
        if: github.event_name != 'push'
        shell: bash
        run: |
          if git diff --quiet -- docs; then
            echo "No CHPY distribution changes. Nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs
          git commit -m "data: update CHPY ROC history and OG image"

          if git push origin master; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 실행 도중 사람이 master를 수정한 경우
          # 자동 생성 파일을 rebase/merge하지 않고 최신 master 기준으로 다시 생성한다.
          echo "Remote master changed while this run was working."
          echo "Refreshing master and regenerating data once..."

          git fetch origin master
          git reset --hard origin/master

          npm install
          npm run update

          if git diff --quiet -- docs; then
            echo "Latest master already contains the current CHPY data."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add docs
          git commit -m "data: update CHPY ROC history and OG image"
          git push origin master

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Decide whether to deploy
        id: deploy_decision
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DATA_CHANGED: ${{ steps.commit_data.outputs.changed }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Deploying because master was pushed."

          elif [ "$DATA_CHANGED" = "true" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Deploying because CHPY data changed."

          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping deployment because CHPY data is unchanged."
          fi

      - name: Upload Pages artifact
        if: steps.deploy_decision.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

  deploy:
    needs: update
    if: needs.update.outputs.should_deploy == 'true'

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
