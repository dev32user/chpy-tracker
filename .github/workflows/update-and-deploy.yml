name: Update CHPY ROC History and Deploy

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions cron uses UTC.
    # Every day at 22:00 KST = 13:00 UTC
    - cron: "0 13 * * *"

  push:
    branches:
      - master

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "chpy-roc-pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Fetch CHPY distribution history and generate OG image
        run: npm run update

      - name: Commit updated files
        run: |
          if git diff --quiet -- docs; then
            echo "No docs changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add docs
            git commit -m "data: update CHPY ROC history and OG image"

            echo "Fetching latest master..."
            git fetch origin master

            echo "Rebasing onto latest master..."
            git rebase origin/master

            echo "Pushing updated files..."
            git push origin master
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

  deploy:
    needs: update

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
