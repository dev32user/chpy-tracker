name: Update CHPY ROC History and Deploy

on:
  workflow_dispatch:

  schedule:
    # 매일 22:17 KST - 일반 fallback
    - cron: "17 22 * * *"
      timezone: "Asia/Seoul"

    # 화요일 CHPY 발표 집중 확인
    # 여름 발표 예상 19:55 KST
    # 겨울 발표 예상 20:55 KST

    # 20:17, 20:47, 21:17, 21:47
    - cron: "17,47 20-21 * * 2"
      timezone: "Asia/Seoul"

    # 22:47
    # 22:17은 위의 매일 fallback과 겹치므로 제외
    - cron: "47 22 * * 2"
      timezone: "Asia/Seoul"

    # 23:17, 23:47
    - cron: "17,47 23 * * 2"
      timezone: "Asia/Seoul"
  push:
    branches:
      - master

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "chpy-roc-pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      # push 이벤트가 발생한 뒤 다른 커밋이 master에 추가됐을 수도 있으므로
      # 항상 현재 원격 master 기준으로 작업한다.
      - name: Sync latest master
        run: |
          git fetch origin master
          git reset --hard origin/master

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # 사람이 master에 push한 경우에는 크롤링하지 않는다.
      # schedule / workflow_dispatch에서만 데이터를 갱신한다.
      - name: Fetch CHPY distribution history and generate OG image
        if: github.event_name != 'push'
        run: npm run update

      - name: Commit updated files
        if: github.event_name != 'push'
        run: |
          if [ -z "$(git status --porcelain -- docs)" ]; then
            echo "No docs changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs
          git commit -m "data: update CHPY ROC history and OG image"

          if git push origin master; then
            echo "Push succeeded."
            exit 0
          fi

          echo "Remote master changed while updating."
          echo "Regenerating from the latest master..."

          git fetch origin master
          git reset --hard origin/master

          npm run update

          if [ -z "$(git status --porcelain -- docs)" ]; then
            echo "No docs changes after regeneration."
            exit 0
          fi

          git add docs
          git commit -m "data: update CHPY ROC history and OG image"

          git push origin master

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

  deploy:
    needs: update
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
