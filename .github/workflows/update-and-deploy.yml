name: Update CHPY ROC History and Deploy

on:
  workflow_dispatch:

  schedule:
    # CHPY/YieldMax의 미국 영업일 기준.
    # 월~금, 매시간 17분 / 47분에 실행.
    - cron: "17,47 * * * 1-5"
      timezone: "America/New_York"

  push:
    branches:
      - master

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "chpy-roc-pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    outputs:
      changed: ${{ steps.commit_data.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Fetch CHPY distribution history and generate OG image
        run: npm run update

      - name: Commit updated data
        id: commit_data
        shell: bash
        run: |
          if git diff --quiet -- docs; then
            echo "No CHPY distribution changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs
          git commit -m "data: update CHPY ROC history and OG image"

          if git push origin master; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Remote master changed. Regenerating from latest master..."

          git fetch origin master
          git reset --hard origin/master

          npm install
          npm run update

          if git diff --quiet -- docs; then
            echo "Latest master already contains the current CHPY data."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add docs
          git commit -m "data: update CHPY ROC history and OG image"
          git push origin master

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        if: steps.commit_data.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
