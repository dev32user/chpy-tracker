name: Update CHPY ROC History and Deploy

on:
  workflow_dispatch:
  schedule:
    # Every Tuesday at 22:00 KST through Wednesday 00:00 KST.
    # GitHub Actions cron uses UTC.
    - cron: "0 13-15 * * 2"
  push:
    branches: ["master"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "chpy-roc-pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          #cache: npm

      - name: Install dependencies
        run: npm install

      - name: Fetch CHPY distribution history
        run: npm run update

      - name: Commit updated history
        id: commit
        run: |
          if git diff --quiet -- docs/data/history.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No history changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/data/history.json
            git commit -m "data: update CHPY ROC history"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
